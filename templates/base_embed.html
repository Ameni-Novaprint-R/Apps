<!DOCTYPE html>
<html lang="fr" style="background-color: #ffffff !important; background: #ffffff !important;">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Portail Novaprint{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo-novaprint.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Forcer le fond blanc pour les pages embed */
        html, body {
            background-color: #ffffff !important;
            background: #ffffff !important;
            background-image: none !important;
        }
        body.bg-light {
            background-color: #ffffff !important;
            background: #ffffff !important;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body style="background-color: #ffffff !important; background: #ffffff !important;">
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

    <!-- Bootstrap JS Bundle (incl. Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
